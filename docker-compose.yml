version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wsscms-postgres
    environment:
      POSTGRES_DB: wsscms_db
      POSTGRES_USER: wsscms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wsscms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wsscms_user -d wsscms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  prophet-service:
    build:
      context: ./prophet-service
      dockerfile: Dockerfile
    container_name: wsscms-prophet
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wsscms-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wsscms_db
      SPRING_DATASOURCE_USERNAME: wsscms_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-wsscms_password}
      JWT_SECRET: ${JWT_SECRET:-ChangeThisSecretInProduction1234567890ABCDEF}
      PROPHET_SERVICE_URL: http://prophet-service:8000
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://frontend:80
    depends_on:
      postgres:
        condition: service_healthy
      prophet-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wsscms-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
