version: '3.9'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: wsscms_db
      POSTGRES_USER: wsscms_user
      POSTGRES_PASSWORD: wsscms_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/wsscms_db
      SPRING_DATASOURCE_USERNAME: wsscms_user
      SPRING_DATASOURCE_PASSWORD: wsscms_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_SECRET: YourSuperSecretKeyForJWTTokenGenerationPleaseChangeThisInProduction123456789
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  db_data:
