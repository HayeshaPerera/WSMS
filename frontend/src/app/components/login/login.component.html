<div class="login-container">
  <div class="login-card">
    
    <!-- Left Side: Illustration -->
    <div class="illustration-side">
      <img src="assets/login-illustration.png" alt="Supply Chain Illustration" class="clipart" />
    </div>

    <!-- Right Side: Form -->
    <div class="form-side">
      <div class="login-header">
        <h2 class="brand-text">WSSCMS</h2>
        <p class="subtitle">Enterprise Supply Chain Portal</p>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        <span class="material-symbols-outlined" style="font-size: 16px; margin-right: 8px;">error</span>
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-row">
          <label for="username">Username</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined icon left-icon">person</span>
            <input 
              type="text" 
              id="username" 
              formControlName="username" 
              [class.error]="usernameInvalid"
              placeholder="Enter username"
            />
          </div>
          <span class="field-error" *ngIf="usernameInvalid">Username is required</span>
        </div>

        <div class="form-row">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <span class="material-symbols-outlined icon left-icon">lock</span>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              formControlName="password" 
              [class.error]="passwordInvalid"
              placeholder="Enter password"
            />
            <button type="button" class="password-toggle" (click)="showPassword = !showPassword" tabindex="-1">
              <span class="material-symbols-outlined icon">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
          <span class="field-error" *ngIf="passwordInvalid">Password is required</span>
        </div>

        <div class="demo-hint">
          <span class="material-symbols-outlined" style="font-size:14px">info</span>
          Demo: <strong>admin</strong> / <strong>warehouse1</strong> / <strong>supermarket1</strong> (pass: <strong>password</strong>)
        </div>

        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || loading">
          <span *ngIf="!loading">Sign In</span>
          <span *ngIf="loading">Signing in...</span>
        </button>
      </form>

    </div>
  </div>
</div>
