<div class="container" style="max-width:480px; margin-top:4rem;">
  <div class="card">
    <div class="card-header">
      <h2 class="card-title">Login</h2>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input class="form-control" [(ngModel)]="credentials.username" name="username" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" [(ngModel)]="credentials.password" name="password" required />
        </div>
        <div *ngIf="error" class="alert alert-danger">{{error}}</div>
        <button class="btn btn-primary" [disabled]="loading" type="submit">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    </div>
  </div>
</div>
