<app-navbar></app-navbar>
<div class="container">
  <h2>Warehouses</h2>
  <div *ngIf="loading" class="spinner"></div>
  <div class="table-container" *ngIf="!loading">
    <table>
      <thead>
        <tr>
          <th>Code</th>
          <th>Name</th>
          <th>Location</th>
          <th>Capacity</th>
          <th>Current Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let w of warehouses">
          <td>{{w.code}}</td>
          <td>{{w.name}}</td>
          <td>{{w.location}}</td>
          <td>{{w.capacity}}</td>
          <td>{{w.currentStock}}</td>
          <td>
            <button class="btn btn-sm" (click)="deleteWarehouse(w.id)"
              style="padding: 0.2rem 0.5rem; font-size: 0.8rem; background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
