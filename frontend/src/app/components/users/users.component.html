<app-navbar></app-navbar>
<div class="container">
  <h2>Users</h2>
  <div *ngIf="loading" class="spinner"></div>
  <div class="table-container" *ngIf="!loading">
    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
          <th>Full Name</th>
          <th>Roles</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td>{{u.username}}</td>
          <td>{{u.email}}</td>
          <td>{{u.fullName}}</td>
          <td>{{rolesLabel(u)}}</td>
          <td>
            <button class="btn btn-sm" (click)="deleteUser(u.id)"
              style="padding: 0.2rem 0.5rem; font-size: 0.8rem; background: var(--danger); color: white; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
