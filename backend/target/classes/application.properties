# ============================================================
# WSMS ERP — Application Configuration
# ============================================================
spring.application.name=Warehouse Supply Chain Management System

# Server
server.port=8081

# ============================================================
# DATABASE
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wsscms_db}
spring.datasource.username=${DB_USERNAME:wsscms_user}
spring.datasource.password=${DB_PASSWORD:newpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA — Flyway manages DDL, Hibernate validates only
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validateOnMigrate=false
spring.flyway.cleanDisabled=false

# ============================================================
# JWT
# ============================================================
# Access token: 15 minutes
jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTTokenGenerationPleaseChangeThisInProduction123456789}
jwt.expiration=900000

# Refresh token: 7 days
jwt.refresh-secret=${JWT_REFRESH_SECRET:YourRefreshSecretKeyForJWTRefreshTokenGenerationChangeThisInProduction987654321}
jwt.refresh-expiration=604800000

# ============================================================
# CORS
# ============================================================
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ============================================================
# PROPHET MICROSERVICE
# ============================================================
prophet.service.url=${PROPHET_URL:http://localhost:8000}

# ============================================================
# SWAGGER / SPRINGDOC
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.info.title=WSMS ERP API
springdoc.info.version=v1
springdoc.info.description=Warehouse and Supermarket Supply Chain Management System REST API

# ============================================================
# LOGGING
# ============================================================
logging.level.root=WARN
logging.level.com.wsscms=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# ============================================================
# ACTUATOR
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
