# Application Name
spring.application.name=Warehouse Supply Chain Management System

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/wsscms_db
spring.datasource.username=wsscms_user
spring.datasource.password=newpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationPleaseChangeThisInProduction123456789
jwt.expiration=86400000

# CORS Configuration
# Change server port to avoid conflict
server.port=8081
cors.allowed-origins=http://localhost:4200

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
