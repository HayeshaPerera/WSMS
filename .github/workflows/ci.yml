name: WSMS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────
  # 1. Backend: Test
  # ─────────────────────────────────────────
  backend-test:
    name: Backend Tests (Java 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wsscms_test
          POSTGRES_USER: wsscms_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: ./backend
        run: mvn test -B
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/wsscms_test
          SPRING_DATASOURCE_USERNAME: wsscms_user
          SPRING_DATASOURCE_PASSWORD: test_password
          JWT_SECRET: test-secret-key-for-ci-1234567890abcdef

  # ─────────────────────────────────────────
  # 2. Frontend: Build
  # ─────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Angular 17)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Angular app
        working-directory: ./frontend
        run: npm run build -- --configuration production

  # ─────────────────────────────────────────
  # 3. Prophet Service: Lint + Test
  # ─────────────────────────────────────────
  prophet-test:
    name: Prophet Service (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./prophet-service
        run: pip install -r requirements.txt

      - name: Start service and check health
        working-directory: ./prophet-service
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/health

  # ─────────────────────────────────────────
  # 4. Docker Build + Push (main branch only)
  # ─────────────────────────────────────────
  docker-push:
    name: Docker Build & Push
    needs: [backend-test, frontend-build, prophet-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push images
        run: |
          docker compose build
          docker compose push
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
